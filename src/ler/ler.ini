# [Locale Emulator Runtime Configuration]
# If this file is omitted, the runtime defaults to full Japanese emulation (CP932, LCID 1041, SHIFTJIS_CHARSET, MS Gothic, Tokyo UTC+9).

[Locale]
# Japanese ANSI / OEM Codepage (932 = Shift-JIS)
AnsiCodePage=932
OemCodePage=932

# Japanese LCID (1041 = 0x0411 = ja-JP)
LocaleID=1041

# Font Charset (128 = SHIFTJIS_CHARSET)
Charset=128

# Default Japanese font face name ("MS Gothic", "Meiryo", "Yu Gothic UI", etc.)
DefaultFont=MS Gothic

# Timezone bias in minutes (-540 = UTC+9 Tokyo)
TimezoneBias=-540

# Hook UI Language APIs (1 = Enable, 0 = Disable)
HookUILanguage=1

# Fix ANSI window title and dialog text mojibake (1 = Enable, 0 = Disable)
FixWindowText=1

# Automatically override font charset to Japanese (1 = Enable, 0 = Disable)
FixFontCharset=1

# Output debug logs to debugger (1 = Enable, 0 = Disable)
DebugLog=0
